<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRICEMG / CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@300;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="authPanel" class="auth-panel">
      <h2>CMS Minimal</h2>
      <div class="field">
        <label for="secret">Clé d'accès</label>
        <input id="secret" type="password" placeholder="Entrez la clé" />
      </div>
      <div class="actions">
        <button id="loginBtn">Ouvrir le CMS</button>
      </div>
    </div>

    <div id="adminPanel" class="admin-shell hidden">
      <h1>Gestion du contenu</h1>

      <div class="admin-grid">
        <div>
          <h3 style="margin-bottom: 16px; font-size: 14px; letter-spacing: 0.14em;">INFO SITE</h3>
          <div class="field">
            <label>Nom du site</label>
            <input id="siteTitle" type="text" value="BRICEMG / STUDIO" />
          </div>
          <div class="field">
            <label>Sous-titre</label>
            <input id="siteSubtitle" type="text" value="DESIGN / CODE / VISION" />
          </div>
          <div class="field">
            <label>Phrase d'accueil</label>
            <textarea id="heroClaim">DES IDÉES QUI ONT UNE FORME, UNE VOIX ET UNE VITESSE.</textarea>
          </div>
          <div class="field">
            <label>Introduction</label>
            <textarea id="intro">Je crée des interfaces, des identités visuelles et des expériences web qui donnent du sens à une idée.</textarea>
          </div>
          <div class="field">
            <label>À propos</label>
            <textarea id="about">Je conçois et développe des projets à la croisée du design, du produit et du code.</textarea>
          </div>
          <div class="field">
            <label>Email</label>
            <input id="email" type="email" value="bonjour@bricemg.dev" />
          </div>
        </div>

        <div>
          <h3 style="margin-bottom: 16px; font-size: 14px; letter-spacing: 0.14em;">ATELIER (CARTES)</h3>
          <div id="cardsContainer"></div>

          <h3 style="margin-top: 32px; margin-bottom: 16px; font-size: 14px; letter-spacing: 0.14em;">PROJETS</h3>
          <div id="projectsContainer"></div>
        </div>
      </div>

      <div class="actions">
        <button id="saveBtn">Enregistrer</button>
        <button id="resetBtn" class="secondary">Réinitialiser</button>
        <a href="index.html" style="display:inline-block; margin-top: 10px; color: var(--ink); text-decoration: underline;">Voir le site</a>
      </div>

      <div id="saveMessage" class="save-message hidden">✓ Enregistré avec succès</div>
    </div>

    <script src="content.js"></script>
    <script>
      const ADMIN_SECRET = 'bricemg';
      const STORAGE_KEY = 'bricemg_site_content_v1';

      function getContent() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return window.defaultContent;
        try {
          return JSON.parse(raw);
        } catch {
          return window.defaultContent;
        }
      }

      function buildCardFields(content) {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        content.cards.forEach((card, index) => {
          const section = document.createElement('div');
          section.style.marginBottom = '24px';
          section.style.paddingBottom = '20px';
          section.style.borderBottom = '1px solid var(--hair)';

          section.innerHTML = `
            <div style="font-size: 10px; letter-spacing: 0.14em; color: var(--ink-faint); margin-bottom: 12px;">CARTE ${index + 1}</div>
            <div class="field">
              <label>Titre</label>
              <input class="card-title" data-index="${index}" type="text" value="${card.title}" />
            </div>
            <div class="field">
              <label>Code</label>
              <input class="card-code" data-index="${index}" type="text" value="${card.code}" />
            </div>
            <div class="field">
              <label>Description</label>
              <textarea class="card-desc" data-index="${index}">${card.desc}</textarea>
            </div>
            <div class="field">
              <label>Type</label>
              <input class="card-type" data-index="${index}" type="text" value="${card.type}" />
            </div>
            <div class="field">
              <label>Statut</label>
              <input class="card-status" data-index="${index}" type="text" value="${card.status}" />
            </div>
          `;
          container.appendChild(section);
        });
      }

      function buildProjectFields(content) {
        const container = document.getElementById('projectsContainer');
        container.innerHTML = '';

        content.projects.forEach((project, index) => {
          const section = document.createElement('div');
          section.style.marginBottom = '24px';
          section.style.paddingBottom = '20px';
          section.style.borderBottom = '1px solid var(--hair)';

          section.innerHTML = `
            <div style="font-size: 10px; letter-spacing: 0.14em; color: var(--ink-faint); margin-bottom: 12px;">PROJET ${index + 1}</div>
            <div class="field">
              <label>Titre</label>
              <input class="project-title" data-index="${index}" type="text" value="${project.title}" />
            </div>
            <div class="field">
              <label>Code</label>
              <input class="project-code" data-index="${index}" type="text" value="${project.code}" />
            </div>
            <div class="field">
              <label>Description</label>
              <textarea class="project-desc" data-index="${index}">${project.desc}</textarea>
            </div>
            <div class="field">
              <label>Type</label>
              <input class="project-type" data-index="${index}" type="text" value="${project.type}" />
            </div>
            <div class="field">
              <label>Phase</label>
              <input class="project-phase" data-index="${index}" type="text" value="${project.phase}" />
            </div>
          `;
          container.appendChild(section);
        });
      }

      function fillForm(content) {
        document.getElementById('siteTitle').value = content.site.title;
        document.getElementById('siteSubtitle').value = content.site.subtitle;
        document.getElementById('heroClaim').value = content.site.heroClaim;
        document.getElementById('intro').value = content.site.intro;
        document.getElementById('about').value = content.site.about;
        document.getElementById('email').value = content.site.email;

        buildCardFields(content);
        buildProjectFields(content);
      }

      function saveFromForm() {
        const content = getContent();
        const next = JSON.parse(JSON.stringify(content));

        next.site.title = document.getElementById('siteTitle').value.trim() || 'BRICEMG / STUDIO';
        next.site.subtitle = document.getElementById('siteSubtitle').value.trim() || 'DESIGN / CODE / VISION';
        next.site.heroClaim = document.getElementById('heroClaim').value.trim();
        next.site.intro = document.getElementById('intro').value.trim();
        next.site.about = document.getElementById('about').value.trim();
        next.site.email = document.getElementById('email').value.trim();

        // Update cards
        document.querySelectorAll('.card-title').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.cards[index].title = el.value.trim();
        });
        document.querySelectorAll('.card-code').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.cards[index].code = el.value.trim();
        });
        document.querySelectorAll('.card-desc').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.cards[index].desc = el.value.trim();
        });
        document.querySelectorAll('.card-type').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.cards[index].type = el.value.trim();
        });
        document.querySelectorAll('.card-status').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.cards[index].status = el.value.trim();
        });

        // Update projects
        document.querySelectorAll('.project-title').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.projects[index].title = el.value.trim();
        });
        document.querySelectorAll('.project-code').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.projects[index].code = el.value.trim();
        });
        document.querySelectorAll('.project-desc').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.projects[index].desc = el.value.trim();
        });
        document.querySelectorAll('.project-type').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.projects[index].type = el.value.trim();
        });
        document.querySelectorAll('.project-phase').forEach(el => {
          const index = parseInt(el.getAttribute('data-index'));
          next.projects[index].phase = el.value.trim();
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));

        // Show save confirmation
        const message = document.getElementById('saveMessage');
        message.classList.remove('hidden');
        setTimeout(() => {
          message.classList.add('hidden');
        }, 2000);
      }

      function resetContent() {
        if (confirm('Êtes-vous sûr? Cela réinitialisera tout le contenu.')) {
          localStorage.removeItem(STORAGE_KEY);
          location.reload();
        }
      }

      function showAdmin() {
        document.getElementById('authPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      }

      document.getElementById('loginBtn').addEventListener('click', () => {
        const value = document.getElementById('secret').value.trim();
        if (value === ADMIN_SECRET) {
          showAdmin();
          fillForm(getContent());
        } else {
          alert('Clé incorrecte.');
        }
      });

      document.getElementById('saveBtn').addEventListener('click', saveFromForm);
      document.getElementById('resetBtn').addEventListener('click', resetContent);

      // Allow Enter key to submit login
      document.getElementById('secret').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          document.getElementById('loginBtn').click();
        }
      });
    </script>
  </body>
</html>
